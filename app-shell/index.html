<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MONTHLIV</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    box-sizing: border-box;
    background: #fbf6f1;
    color: #4b362c;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    text-align: center;
    word-break: keep-all;
  }
  main { display: grid; gap: 12px; max-width: 320px; justify-items: center; }
  h1 { margin: 0; font-size: 22px; line-height: 28px; }
  p { margin: 0; font-size: 15px; line-height: 22px; color: #75615a; }
  button {
    margin-top: 8px;
    height: 48px;
    padding: 0 24px;
    border-radius: 12px;
    border: 0;
    background: #4b362c;
    color: #ffffff;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
  }
</style>
</head>
<body>
<main>
  <h1>인터넷에 연결되지 않았어요</h1>
  <p>연결을 확인한 뒤 다시 시도해 주세요.</p>
  <p lang="en">You're offline. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">다시 시도 · Try again</button>
</main>
</body>
</html>
